<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block World Multiplayer</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="loginScreen">
    <div class="login-card">
      <h1>BLOCK WORLD</h1>
      <p>Multijugador</p>

      <label>Nombre</label>
      <input id="nameInput" maxlength="20" placeholder="Tu nombre">

      <label>Contraseña</label>
      <input id="passwordInput" type="password" placeholder="Contraseña">

      <button id="loginBtn">INGRESAR</button>
      <div id="loginMsg"></div>

      <div class="test-note">
        Contraseña de prueba: <b>apolo123</b>
      </div>
    </div>
  </div>

  <div id="menu" class="hidden">
    <div class="panel">
      <h1>BLOCK WORLD</h1>
      <p>Haz clic para volver al juego.</p>
      <button id="playBtn">VOLVER AL JUEGO</button>
      <div class="controls">
        <span>WASD: moverse</span>
        <span>Espacio: saltar</span>
        <span>Shift: correr</span>
        <span>Clic izquierdo: romper</span>
        <span>Clic derecho: colocar</span>
        <span>1-5: seleccionar bloque</span>
        <span>Enter: abrir chat</span>
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair">+</div>

    <div id="status">
      <div id="coords">X 0 Y 0 Z 0</div>
      <div id="online">Jugadores: 1</div>
    </div>

    <div id="playersBox">
      <strong>Conectados</strong>
      <div id="playersList"></div>
    </div>

    <div id="chatBox">
      <div id="messages"></div>
      <input id="chatInput" maxlength="120" placeholder="Escribe y presiona Enter">
    </div>

    <div id="hotbar">
      <div class="slot selected"><span class="cube grass"></span><small>1</small></div>
      <div class="slot"><span class="cube dirt"></span><small>2</small></div>
      <div class="slot"><span class="cube stone"></span><small>3</small></div>
      <div class="slot"><span class="cube sand"></span><small>4</small></div>
      <div class="slot"><span class="cube wood"></span><small>5</small></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./js/game.js"></script>
</body>
</html>
