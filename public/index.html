<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Block World V2</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="loginScreen">
  <div class="panel">
    <h1>BLOCK WORLD</h1>
    <h3>V2 MULTIPLAYER</h3>
    <label>Nombre</label>
    <input id="nameInput" maxlength="20" placeholder="Tu nombre">
    <label>Contraseña</label>
    <input id="passwordInput" type="password" placeholder="Contraseña">
    <button id="loginBtn">INGRESAR</button>
    <div id="loginMsg"></div>
    <small>Prueba: apolo123</small>
  </div>
</div>

<div id="menu" class="hidden">
  <div class="panel">
    <h1>BLOCK WORLD</h1>
    <p>Juego pausado</p>
    <button id="playBtn">VOLVER AL JUEGO</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="crosshair">+</div>
  <div id="topInfo">
    <div id="coords">X 0 Y 0 Z 0</div>
    <div id="biome">Bioma: Llanura</div>
    <div id="online">Jugadores: 1</div>
    <div id="dayState">Día</div>
  </div>
  <div id="playersBox"><b>Conectados</b><div id="playersList"></div></div>
  <div id="chatBox"><div id="messages"></div><input id="chatInput" maxlength="140" placeholder="Mensaje..."></div>
  <div id="selectedName">Césped</div>
  <div id="hotbar">
    <div class="slot selected"><span class="cube grass"></span><small>1</small></div>
    <div class="slot"><span class="cube dirt"></span><small>2</small></div>
    <div class="slot"><span class="cube stone"></span><small>3</small></div>
    <div class="slot"><span class="cube sand"></span><small>4</small></div>
    <div class="slot"><span class="cube wood"></span><small>5</small></div>
    <div class="slot"><span class="cube leaves"></span><small>6</small></div>
    <div class="slot"><span class="cube snow"></span><small>7</small></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module" src="./js/game.js"></script>
</body>
</html>
